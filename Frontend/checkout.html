<!DOCTYPE html>
<html>
<head>
  <title>Checkout</title>

  <style>
    body { font-family: Arial; background:#e6f2ff; margin:0; }
    header { background:#003366; color:white; padding:15px; text-align:center; }
    .container { padding:20px; }
    .card { background:white; padding:15px; margin:10px 0; border-radius:8px; }
    button { background:#0066cc; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; }
    button:hover { background:#004999; }
  </style>
</head>

<body>

<header>
  <h1>Checkout 🧾</h1>
</header>

<div class="container">

<div id="summary"></div>

<h3 id="total"></h3>

<button onclick="placeOrder()">Place Order</button>

</div>

<script>
function loadCheckout() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  const summary = document.getElementById("summary");
  const totalDisplay = document.getElementById("total");

  let total = 0;

  cart.forEach(item => {
    total += Number(item.price);

    const div = document.createElement("div");

    div.innerHTML = `
      <div class="card">
        <p>${item.name} - $${item.price}</p>
      </div>
    `;

    summary.appendChild(div);
  });

  totalDisplay.innerText = "Total: $" + total.toFixed(2);
}

function placeOrder() {
  alert("Order placed successfully!");
  localStorage.removeItem("cart");
  window.location.href = "home.html";
}

window.onload = loadCheckout;
</script>

</body>
</html>
