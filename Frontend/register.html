<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <style>
    body { font-family: Arial; background:#e6f2ff; }
    header { background:#003366; color:white; padding:15px; text-align:center; }
    .container { padding:20px; }
    button { background:#0066cc; color:white; padding:10px; border:none; }
  </style>
</head>

<body>

<header>
  <h1>Create Account 📝</h1>
</header>

<div class="container">

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>
<input id="confirm" type="password" placeholder="Confirm Password"><br><br>

<button onclick="register()">Register</button>

<p id="result"></p>

<a href="login.html">Back to Login</a>

</div>

<script>
async function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password !== confirm) {
    document.getElementById("result").innerText = "Passwords do not match!";
    return;
  }

  const res = await fetch("/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  document.getElementById("result").innerText = data.message;

  if (data.success) {
    window.location.href = "login.html";
  }
}
</script>

</body>
</html>
