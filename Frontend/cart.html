<!DOCTYPE html>
<html>
<head>
  <title>Cart</title>

  <style>
    body { font-family: Arial; background:#e6f2ff; margin:0; }
    header { background:#003366; color:white; padding:15px; text-align:center; }
    .container { padding:20px; }
    .card { background:white; padding:15px; margin:10px 0; border-radius:8px; }
    button { background:#0066cc; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer; }
    button:hover { background:#004999; }
  </style>
</head>

<body>

<header>
  <h1>Your Cart 🛒</h1>
</header>

<div class="container">

<button onclick="goBack()">⬅ Back to Home</button>

<div id="cart"></div>

<h3 id="total">Total: $0</h3>

<button onclick="clearCart()">Clear Cart</button>
<button onclick="goToCheckout()">Checkout</button>

</div>

<script>
function loadCart() {
  const container = document.getElementById("cart");
  const totalDisplay = document.getElementById("total");

  if (!container || !totalDisplay) return;

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  container.innerHTML = "";

  let total = 0;

  if (cart.length === 0) {
    container.innerHTML = "<p>Cart is empty</p>";
    totalDisplay.innerText = "Total: $0";
    return;
  }

  cart.forEach((item, index) => {
    total += Number(item.price);

    const div = document.createElement("div");

    div.innerHTML = `
      <div class="card">
        <h3>${item.name}</h3>
        <p>$${item.price}</p>
        <button onclick="removeItem(${index})">Remove</button>
      </div>
    `;

    container.appendChild(div);
  });

  totalDisplay.innerText = "Total: $" + total.toFixed(2);
}

function removeItem(index) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.splice(index, 1);
  localStorage.setItem("cart", JSON.stringify(cart));
  loadCart();
}

function clearCart() {
  localStorage.removeItem("cart");
  loadCart();
}

function goBack() {
  window.location.href = "home.html";
}

function goToCheckout() {
  window.location.href = "checkout.html";
}

window.onload = loadCart;
</script>

</body>
</html>
