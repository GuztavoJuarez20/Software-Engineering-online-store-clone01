<!DOCTYPE html>
<html>
<head>
  <title>Home</title>

  <style>
    body { font-family: Arial; background:#e6f2ff; margin:0; }
    header { background:#003366; color:white; padding:15px; text-align:center; }
    .container { padding:20px; }

    #products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background:white;
      padding:15px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 0 8px rgba(0,0,0,0.1);
    }

    img {
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:8px;
    }

    button {
      background:#0066cc;
      color:white;
      border:none;
      padding:10px;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover { background:#004999; }

    a { color:#0066cc; font-weight:bold; }
  </style>
</head>

<body>

<header>
  <h1>Amazon Clone 🛒</h1>
</header>

<div class="container">

<a href="cart.html">Go to Cart 🛒</a>

<h2>Products</h2>

<!-- 🔍 SEARCH BAR -->
<div style="margin-bottom:20px;">
  <input id="search" placeholder="Search products..." style="padding:10px; width:250px;">
  <button onclick="searchProducts()">Search</button>
  <button onclick="loadProducts()">Reset</button>
</div>

<div id="products"></div>

</div>

<script>
async function loadProducts(search = "") {
  let url = "/products";
  if (search) url += "?search=" + encodeURIComponent(search);

  const res = await fetch(url);
  const products = await res.json();

  const container = document.getElementById("products");
  container.innerHTML = "";

  if (products.length === 0) {
    container.innerHTML = "<p>No products found</p>";
    return;
  }

  products.forEach(p => {
    const div = document.createElement("div");

    div.innerHTML = `
      <div class="card">
        <img src="${p.image}">
        <h3>${p.name}</h3>
        <p>$${p.price}</p>
        <p>${p.description}</p>
        <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})">
          Add to Cart
        </button>
      </div>
    `;

    container.appendChild(div);
  });
}

function searchProducts() {
  const value = document.getElementById("search").value;
  loadProducts(value);
}

function addToCart(id, name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({ id, name, price });
  localStorage.setItem("cart", JSON.stringify(cart));
  alert(name + " added to cart!");
}

window.onload = loadProducts;
</script>

</body>
</html>
