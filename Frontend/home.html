<!DOCTYPE html>
<html>
<head>
  <title>Amazon Clone - Home</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #e6f2ff;
    }

    header {
      background: #003366;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #cce0ff;
    }

    /* 🔍 AMAZON-STYLE SEARCH BAR */
    .search-bar {
      display: flex;
      align-items: center;
    }

    .search-bar input {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-right: none;
      outline: none;
      border-radius: 5px 0 0 5px;
    }

    .search-bar button {
      padding: 10px 15px;
      background: #ff9900;
      border: 1px solid #ff9900;
      cursor: pointer;
      border-radius: 0 5px 5px 0;
    }

    .search-bar button:hover {
      background: #e68a00;
    }

    .top-bar a {
      font-weight: bold;
      text-decoration: none;
      color: #003366;
    }

    /* 🔥 CATEGORY BUTTONS */
    .categories {
      padding: 10px;
      text-align: center;
    }

    .categories button {
      margin: 5px;
      padding: 8px 12px;
      background: #0066cc;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .categories button:hover {
      background: #004999;
    }

    h2 {
      padding-left: 20px;
    }

    /* 🔥 4 PER ROW */
    #products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .product-card:hover {
      transform: scale(1.03);
    }

    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .product-card button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .product-card button:hover {
      background: #004999;
    }
  </style>
</head>

<body>

<header>
  <h1>Amazon Clone 🛒</h1>
</header>

<div class="top-bar">

  <div class="search-bar">
    <input 
      id="search" 
      placeholder="Search products..." 
      oninput="loadProducts()"
    >
    <button onclick="loadProducts()">🔍</button>
  </div>

  <a href="cart.html">Go to Cart 🛒</a>

</div>

<!-- 🔥 CATEGORY FILTERS -->
<div class="categories">
  <button onclick="filterCategory('')">All</button>
  <button onclick="filterCategory('laptop')">Laptops</button>
  <button onclick="filterCategory('cable')">Accessories</button>
  <button onclick="filterCategory('keyboard')">Keyboards</button>
</div>

<h2>Products</h2>

<div id="products"></div>

<script>
let currentCategory = "";

// CATEGORY FILTER
function filterCategory(category) {
  currentCategory = category;
  loadProducts();
}

// LOAD PRODUCTS
async function loadProducts() {
  try {
    const search = document.getElementById("search").value.toLowerCase();

    const res = await fetch("/products");
    const products = await res.json();

    const container = document.getElementById("products");
    container.innerHTML = "";

    let filtered = products;

    // 🔍 SEARCH FILTER
    if (search) {
      filtered = filtered.filter(p =>
        p.name.toLowerCase().includes(search)
      );
    }

    // 🔥 CATEGORY FILTER
    if (currentCategory) {
      filtered = filtered.filter(p =>
        p.name.toLowerCase().includes(currentCategory)
      );
    }

    if (filtered.length === 0) {
      container.innerHTML = "<p>No products found</p>";
      return;
    }

    filtered.forEach(product => {
      const div = document.createElement("div");
      div.className = "product-card";

      div.innerHTML = `
        <img src="${product.image}">
        <h3>${product.name}</h3>
        <p><strong>$${Number(product.price).toFixed(2)}</strong></p>
        <p>${product.description}</p>

        <button onclick='addToCart(${product.id}, ${JSON.stringify(product.name)}, ${product.price})'>
          Add to Cart
        </button>
      `;

      container.appendChild(div);
    });

  } catch (err) {
    console.error("Error loading products:", err);
  }
}

// ADD TO CART
function addToCart(id, name, price) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({ id, name, price });

  localStorage.setItem("cart", JSON.stringify(cart));

  alert(name + " added to cart!");
}

// ENTER KEY SUPPORT
document.getElementById("search").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    loadProducts();
  }
});

// LOAD ON START
loadProducts();
</script>

</body>
</html>
